<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>School Events Gallery | Glenn-Sha Lights & Sounds</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090910;
      color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: #08080d;
    }

    header h1 {
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff7b00, #ffb347);
      color: white;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery-card:hover {
      transform: scale(1.03);
    }

    .gallery-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .gallery-card p {
      padding: 12px;
      font-size: 14px;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
    }

    .lightbox.active {
      display: flex;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>School Events Gallery</h1>
  <p>School programs and events handled by Glenn-Sha Lights & Sounds</p>
  <a href="index.html" class="back-btn">← Back to Home</a>
</header>

<div class="container">
  <div class="gallery-grid">

    <div class="gallery-card" onclick="openLightbox('event3.jpg')">
      <img src="event3.jpg">
      <p>University Graduation Ceremony</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event2.jpg')">
      <img src="event2.jpg">
      <p>Elementary Recognition Day</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event1.jpg')">
      <img src="event1.jpg">
      <p>High School Moving Up Ceremony</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event4.jpg')">
      <img src="event4.jpg">
      <p>School Program & Performances</p>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img">
</div>

<script>
  function openLightbox(src) {
    document.getElementById("lightbox").classList.add("active");
    document.getElementById("lightbox-img").src = src;
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }
</script>

</body>
</html>
