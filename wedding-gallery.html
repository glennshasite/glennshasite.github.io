<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wedding Events Gallery | Glenn-Sha Lights & Sounds</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #090910;
      color: white;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: #08080d;
    }

    header h1 {
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff7b00, #ffb347);
      color: white;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .gallery-card {
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery-card:hover {
      transform: scale(1.03);
    }

    .gallery-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .gallery-card p {
      padding: 12px;
      font-size: 14px;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
    }

    .lightbox.active {
      display: flex;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      cursor: pointer;
      padding: 10px;
      color: white;
      user-select: none;
    }

    .prev {
      left: 20px;
    }

    .next {
      right: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Wedding Events Gallery</h1>
  <p>Actual weddings handled by Glenn-Sha Lights & Sounds</p>
  <a href="index.html" class="back-btn">← Back to Home</a>
</header>

<div class="container">
  <div class="gallery-grid">

    <div class="gallery-card" onclick="openLightbox('event2.jpg')">
      <img src="event2.jpg">
      <p>Alex & Toni Nuptial</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event1.jpg')">
      <img src="event1.jpg">
      <p>Dela Cruz Wedding</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event3.jpg')">
      <img src="event3.jpg">
      <p>Juan & Juana Wedding</p>
    </div>

    <div class="gallery-card" onclick="openLightbox('event4.jpg')">
      <img src="event4.jpg">
      <p>Garden Wedding Setup</p>
    </div>

  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">✕</span>
  <span class="nav prev" onclick="prevImage()">❮</span>
  <img id="lightbox-img">
  <span class="nav next" onclick="nextImage()">❯</span>
</div>

<script>
  let images = [
    "event1.jpg",
    "event2.jpg",
    "event3.jpg",
    "event4.jpg"
  ];

  let currentIndex = 0;
  let startX = 0;

  function openLightbox(src) {
    currentIndex = images.indexOf(src);
    document.getElementById("lightbox").classList.add("active");
    document.getElementById("lightbox-img").src = src;
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    document.getElementById("lightbox-img").src = images[currentIndex];
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    document.getElementById("lightbox-img").src = images[currentIndex];
  }

  document.addEventListener("keydown", function(e) {
    if (!document.getElementById("lightbox").classList.contains("active")) return;

    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
  });

  document.getElementById("lightbox").addEventListener("touchstart", function(e) {
    startX = e.touches[0].clientX;
  });

  document.getElementById("lightbox").addEventListener("touchend", function(e) {
    let endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) nextImage();
    if (endX - startX > 50) prevImage();
  });
</script>

</body>
</html>
